name: Generate Signing Key
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore & Base64
        run: |
          keytool -genkey -v -keystore vanta.jks -keyalg RSA -keysize 2048 -validity 10000 -alias vanta -storepass vanta2026 -keypass vanta2026 -dname "CN=Vanta, OU=Media, O=Vanta, L=NA, S=NA, C=US"
          echo "=== COPY BASE64 BELOW ==="
          base64 -w 0 vanta.jks
