      - name: Generate Clean XML Files
        run: |
          python3 -c '
          import os
          ns = "http://" + "://android.com"
          tools = "http://" + "://android.com"
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w").write(f"""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="{ns}">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@android:drawable/ic_media_play" />
          </adaptive-icon>
          """)
          open("app/src/main/AndroidManifest.xml", "w").write(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns}" xmlns:tools="{tools}">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:name=".VantaApplication"
                  android:allowBackup="true"
                  android:banner="@mipmap/ic_launcher"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Vanta"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true"
                  tools:targetApi="35">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.OPEN_DOCUMENT_TREE" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".player.service.VantaPlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          """)
          '
