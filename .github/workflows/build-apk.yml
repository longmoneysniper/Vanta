name: Build Vanta APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix AndroidManifest namespace
        run: |
          NS="http://android.com"
          sed -i "s|xmlns:android=\"[^\"]*\"|xmlns:android=\"${NS}/apk/res/android\"|g" app/src/main/AndroidManifest.xml
          sed -i "s|xmlns:tools=\"[^\"]*\"|xmlns:tools=\"${NS}/tools\"|g" app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
